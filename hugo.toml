baseURL = "https://go-ruby-marshal.github.io/"
title = "go-ruby-marshal"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[[params.repos]]
  name = "marshal"
  url = "https://github.com/go-ruby-marshal/marshal"
  status = "ready"
  blurb = "The library: `Marshal.dump` / `Marshal.load` for Ruby's binary serialization (wire format **v4.8**) over a typed value model — `Nil` / `Bool` / `Int` / `Float` / `Symbol` / `Str` / `Array` / `Hash`. Byte-for-byte identical to MRI: the Fixnum/Bignum split, MRI's shortest-float formatting, the symbol table, and the object-link table so shared objects and **cycles** round-trip."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 10.02:1, bright on the dark background 4.00:1.
  base = "#7f1d1d"
  deep = "#4d1212"
  bright = "#dc2626"
  shadow = "rgba(127,29,29,.7)"
  glow = "rgba(127,29,29,.6)"
  wash = "rgba(127,29,29,.10)"
  washDeep = "rgba(77,18,18,.06)"
  chipBg = "#fbe5e5"
  chipBorder = "#f4bebe"
  chipFg = "#4d1212"
  chipBgDark = "rgba(220,38,38,.14)"
  chipBorderDark = "rgba(220,38,38,.32)"
  chipFgDark = "#ec8888"
  statsEnd = "#f7cbcb"
  bandText = "#f9dcdc"
